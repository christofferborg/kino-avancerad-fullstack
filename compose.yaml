services:
  server:
    build:
      context: .
    container_name: kino-avancerad-fullstack-server-1
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:${DB_PASSWORD}@db:5432/comment_db"
      OMDB_API_KEY: ${OMDB_API_KEY}
      TMDB_API_KEY: ${TMDB_API_KEY}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:latest
    container_name: nextjs_postgres_db
    restart: always
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: comment_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d comment_db"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  postgres_data: